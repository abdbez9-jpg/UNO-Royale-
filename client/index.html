<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNO Royale</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="mobile-container">

    <!-- الخلفية -->
    <div class="blob red"></div>
    <div class="blob blue"></div>
    <div class="blob yellow"></div>
    <div class="blob green"></div>

    <!-- 🏠 الشاشة الرئيسية -->
    <section id="home" class="screen active">

        <header class="player-card">
            <div class="avatar-placeholder"></div>
            <div class="player-info">
                <span class="player-name">اسم اللاعب</span>
            </div>
        </header>

        <section class="logo-area">
            <h1 class="uno-logo">UNO</h1>
            <h2 class="royale-text">ROYALE</h2>
        </section>

        <main class="menu-buttons">

            <button class="btn solo" onclick="go('single')">
                🎯 اللعب الفردي
            </button>

            <button class="btn multiplayer" onclick="go('multi')">
                🌐 اللعب الجماعي
            </button>

            <button class="btn friends" onclick="go('friends')">
                👥 الأصدقاء
            </button>

        </main>

        <footer class="bottom-nav">
            <button class="glass-btn" onclick="go('profile')">الملف الشخصي</button>
            <button class="glass-btn" onclick="go('settings')">الإعدادات</button>
        </footer>

    </section>

    <!-- باقي الشاشات -->
    <section id="single" class="screen">
        <button onclick="go('home')">⬅ رجوع</button>
        <h2>اللعب الفردي</h2>
    </section>

    <section id="multi" class="screen">
        <button onclick="go('home')">⬅ رجوع</button>
        <h2>اللعب الجماعي</h2>
    </section>

    <section id="friends" class="screen">
        <button onclick="go('home')">⬅ رجوع</button>
        <h2>الأصدقاء</h2>
    </section>

    <section id="profile" class="screen">
        <button onclick="go('home')">⬅ رجوع</button>
        <h2>الملف الشخصي</h2>
    </section>

    <section id="settings" class="screen">
        <button onclick="go('home')">⬅ رجوع</button>
        <h2>الإعدادات</h2>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
