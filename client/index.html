<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Royale</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-viewport">

    <!-- 🏠 الشاشة الرئيسية -->
    <section id="home" class="screen active">

        <div class="player-card">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=UNO" class="avatar">
            <div>
                <div class="name">لاعب 1</div>
            </div>
        </div>

        <h1 class="logo">UNO ROYALE</h1>

        <div class="menu">

            <button onclick="go('single')">
                🎯 لعب فردي
            </button>

            <button onclick="go('multi')">
                🌐 لعب جماعي
            </button>

            <button onclick="go('friends')">
                👥 الأصدقاء
            </button>

            <button onclick="go('settings')">
                ⚙️ الإعدادات
            </button>

        </div>

    </section>

    <!-- 🎯 لعب فردي -->
    <section id="single" class="screen">

        <button onclick="go('home')">⬅ رجوع</button>

        <h2 style="color:white; text-align:center; margin-top:20px;">
            اللعب الفردي
        </h2>

        <button onclick="startGame()" style="margin-top:20px;">
            ابدأ اللعبة
        </button>

    </section>

    <!-- 🌐 لعب جماعي -->
    <section id="multi" class="screen">

        <button onclick="go('home')">⬅ رجوع</button>

        <h2 style="color:white; text-align:center; margin-top:20px;">
            اللعب الجماعي
        </h2>

    </section>

    <!-- 👥 الأصدقاء -->
    <section id="friends" class="screen">

        <button onclick="go('home')">⬅ رجوع</button>

        <h2 style="color:white; text-align:center; margin-top:20px;">
            الأصدقاء
        </h2>

    </section>

    <!-- ⚙️ الإعدادات -->
    <section id="settings" class="screen">

        <button onclick="go('home')">⬅ رجوع</button>

        <h2 style="color:white; text-align:center; margin-top:20px;">
            الإعدادات
        </h2>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
