<!DOCTYPE html>
<html>
<head>
  <title>UNO TRIBE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      background: linear-gradient(135deg, #3f51b5, #4caf50, #ff9800);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      transform: scale(1.3); /* تكبير */
    }

    h1 {
      font-size: 55px;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
    }

    .btn {
      display: block;
      width: 300px;
      margin: 20px auto;
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .single {
      background: linear-gradient(to right, #2196f3, #4caf50);
    }

    .multi {
      background: linear-gradient(to right, #ff5722, #ffc107);
    }

    .settings {
      font-size: 30px;
      margin-top: 30px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>UNO TRIBE</h1>
  <p>Join the circle</p>

  <button class="btn single" onclick="goGame()">
    SINGLE PLAYER
  </button>

  <button class="btn multi" onclick="goLobby()">
    MULTIPLAYER
  </button>

  <div class="settings" onclick="goSettings()">⚙️</div>
</div>

<script>
function goGame() {
  window.location.href = "game.html";
}

function goLobby() {
  window.location.href = "lobby.html";
}

function goSettings() {
  window.location.href = "settings.html";
}
</script>

</body>
</html>
