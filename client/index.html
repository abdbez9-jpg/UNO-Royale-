<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Royale</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-viewport">

    <!-- 🏠 الشاشة الرئيسية -->
    <section id="home" class="screen active">

        <div class="top-bar">
            <div class="player-card">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=player" class="avatar">

                <div>
                    <div class="name">لاعب 1</div>
                    <div class="level">المستوى 15</div>
                </div>
            </div>
        </div>

        <h1 class="logo">UNO ROYALE</h1>

        <div class="menu">

            <button class="btn red" onclick="go('single')">
                🎯 لعب فردي
            </button>

            <button class="btn blue" onclick="go('multi')">
                🌐 لعب جماعي
            </button>

            <button class="btn yellow" onclick="go('friends')">
                👥 الأصدقاء
            </button>

            <div class="bottom">
                <button class="small" onclick="go('profile')">👤 الملف الشخصي</button>
                <button class="small" onclick="go('settings')">⚙️ الإعدادات</button>
            </div>

        </div>
    </section>

    <!-- 🎯 لعب فردي -->
    <section id="single" class="screen">
        <button class="back" onclick="go('home')">⬅ العودة</button>
        <h2>اللعب ضد الذكاء الاصطناعي</h2>

        <button onclick="startGame()">ابدأ اللعبة</button>
    </section>

    <!-- 🌐 لعب جماعي -->
    <section id="multi" class="screen">
        <button class="back" onclick="go('home')">⬅ العودة</button>
        <h2>لعب جماعي</h2>

        <button>إنشاء غرفة</button>
        <button>انضمام إلى غرفة</button>
    </section>

    <!-- 👥 الأصدقاء -->
    <section id="friends" class="screen">
        <button class="back" onclick="go('home')">⬅ العودة</button>
        <h2>قائمة الأصدقاء</h2>
    </section>

    <!-- 👤 الملف الشخصي -->
    <section id="profile" class="screen">
        <button class="back" onclick="go('home')">⬅ العودة</button>
        <h2>الملف الشخصي</h2>
    </section>

    <!-- ⚙️ الإعدادات -->
    <section id="settings" class="screen">
        <button class="back" onclick="go('home')">⬅ العودة</button>
        <h2>الإعدادات</h2>
    </section>

</div>

<script src="script.js"></script>
</body>
          </html>
