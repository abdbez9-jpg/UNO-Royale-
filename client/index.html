<!DOCTYPE html>
<html>
<head>
  <title>UNO Royale</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;

      /* الخلفية مثل التصميم */
      background: linear-gradient(135deg, #3f51b5, #4caf50, #ff9800);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 40px;
      opacity: 0.8;
    }

    .btn {
      display: block;
      width: 250px;
      margin: 15px auto;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .single {
      background: linear-gradient(to right, #2196f3, #4caf50);
    }

    .multi {
      background: linear-gradient(to right, #ff5722, #ffc107);
    }

    .settings {
      margin-top: 30px;
      font-size: 25px;
      cursor: pointer;
    }
  </style>

</head>

<body>

<div class="container">
  <h1>UNO TRIBE</h1>
  <p>Join the circle</p>

  <button class="btn single" onclick="singlePlayer()">
    SINGLE PLAYER
  </button>

  <button class="btn multi" onclick="multiPlayer()">
    MULTIPLAYER
  </button>

  <div class="settings" onclick="openSettings()">⚙️</div>
</div>

<script>
function singlePlayer() {
  alert("Single Player coming soon!");
}

function multiPlayer() {
  alert("Multiplayer coming soon!");
}

function openSettings() {
  alert("Settings coming soon!");
}
</script>

</body>
</html>
