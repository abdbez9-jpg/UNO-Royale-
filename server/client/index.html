<!DOCTYPE html>
<html>
<head>
  <title>UNO Royale</title>
</head>
<body>

<h1>UNO Royale 🎮</h1>

<button onclick="joinGame()">Join Game</button>
<button onclick="drawCard()">Draw Card</button>

<div id="players"></div>
<div id="hand"></div>
<div id="topCard"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io("https://uno-game-1.onrender.com");

function joinGame() {
  socket.emit("join");
}

function drawCard() {
  socket.emit("drawCard");
}

socket.on("players", (players) => {
  document.getElementById("players").innerText =
    "Players: " + players.length;
});

socket.on("gameState", (state) => {
  document.getElementById("topCard").innerText =
    "Top Card: " + state.topCard.type + " " + state.topCard.color;

  const myHand = state.hands[socket.id] || [];

  let html = "<h3>Your Cards:</h3>";

  myHand.forEach(card => {
    html += `
      <button onclick="playCard('${card.id}')">
        ${card.type} ${card.color}
      </button>
    `;
  });

  document.getElementById("hand").innerHTML = html;
});

function playCard(cardId) {
  socket.emit("playCard", { cardId });
}
</script>

</body>
</html>
