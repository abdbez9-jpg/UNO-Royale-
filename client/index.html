<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO ROYALE</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="phone-screen">

    <!-- الخلفية -->
    <div class="blob b-red"></div>
    <div class="blob b-blue"></div>
    <div class="blob b-green"></div>
    <div class="blob b-yellow"></div>

    <!-- شريط اللاعب -->
    <div class="player-bar">
        <div class="avatar"></div>
        <div class="player-name">اسم اللاعب</div>
    </div>

    <!-- الشعار -->
    <div class="logo-container">
        <div class="uno-text">UNO</div>
        <div class="royale-text">ROYALE</div>
    </div>

    <!-- الأزرار -->
    <div class="menu">
        <button class="main-btn btn-red" onclick="go('single')">🎯 اللعب الفردي</button>
        <button class="main-btn btn-blue" onclick="go('multi')">🌐 اللعب الجماعي</button>
        <button class="main-btn btn-yellow" onclick="go('friends')">👥 الأصدقاء</button>
    </div>

    <!-- أزرار سفلية -->
    <div class="footer">
        <button class="small-btn" onclick="go('profile')">الملف الشخصي</button>
        <button class="small-btn" onclick="go('settings')">الإعدادات</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
